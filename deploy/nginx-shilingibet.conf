# ShilingiBet web (SPA). Issue the certificate first with:
#   sudo certbot certonly --nginx -d shilingibet.com -d www.shilingibet.com

# Plain HTTP only redirects to HTTPS (and serves ACME challenges for renewals).
server {
  listen 80;
  listen [::]:80;
  server_name shilingibet.com www.shilingibet.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://shilingibet.com$request_uri;
  }
}

# Canonical host: www -> apex.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.shilingibet.com;

  ssl_certificate     /etc/letsencrypt/live/shilingibet.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shilingibet.com/privkey.pem;

  return 301 https://shilingibet.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name shilingibet.com;

  ssl_certificate     /etc/letsencrypt/live/shilingibet.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shilingibet.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server_tokens off;

  root /var/www/shilingibet/dist;
  index index.html;

  # Security headers. `always` makes them apply to error responses too.
  # nginx drops server-level add_header when a location adds its own, so the
  # cache-control locations below include this snippet again.
  set $hsts "max-age=31536000; includeSubDomains";
  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Compression for text assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

  # Main SPA entry should revalidate frequently
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    expires -1;
    try_files $uri =404;
  }

  # Fingerprinted Vite assets can be cached aggressively
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1y;
    try_files $uri =404;
  }

  # Static images, fonts, icons, media
  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf|mp4|webm)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 30d;
    try_files $uri =404;
  }

  # Service worker must never be cached
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    expires -1;
    try_files $uri =404;
  }

  # Never serve dotfiles (.env, .git, ...) if they ever land in the web root
  location ~ /\. {
    deny all;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
